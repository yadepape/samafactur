<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Complet - SamaFacture</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        .header h1 {
            margin: 0;
            font-size: 2.5em;
            font-weight: 300;
        }
        .content {
            padding: 30px;
        }
        .test-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }
        .test-section {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            border-left: 5px solid #007bff;
        }
        .test-section h3 {
            margin-top: 0;
            color: #333;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .status {
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9em;
            display: inline-block;
            margin: 5px;
        }
        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .status.warning {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeaa7;
        }
        .status.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        .test-button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 25px;
            cursor: pointer;
            margin: 5px;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        .test-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        .test-button:active {
            transform: translateY(0);
        }
        .log {
            background: #2d3748;
            color: #e2e8f0;
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
            font-family: 'Courier New', monospace;
            white-space: pre-wrap;
            max-height: 400px;
            overflow-y: auto;
            font-size: 0.9em;
            line-height: 1.4;
        }
        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e9ecef;
            border-radius: 4px;
            overflow: hidden;
            margin: 10px 0;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #28a745, #20c997);
            width: 0%;
            transition: width 0.3s ease;
        }
        .stats {
            display: flex;
            justify-content: space-around;
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
        }
        .stat {
            text-align: center;
        }
        .stat-number {
            font-size: 2em;
            font-weight: bold;
            color: #007bff;
        }
        .stat-label {
            color: #6c757d;
            font-size: 0.9em;
        }
        .module-test {
            background: white;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 15px;
            margin: 10px 0;
        }
        .module-test h4 {
            margin: 0 0 10px 0;
            color: #495057;
        }
        .test-result {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 5px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🧪 Test Complet - SamaFacture</h1>
            <p>Vérification exhaustive de tous les gestionnaires et fonctionnalités</p>
        </div>
        
        <div class="content">
            <div class="stats">
                <div class="stat">
                    <div class="stat-number" id="total-tests">0</div>
                    <div class="stat-label">Tests Total</div>
                </div>
                <div class="stat">
                    <div class="stat-number" id="passed-tests">0</div>
                    <div class="stat-label">Réussis</div>
                </div>
                <div class="stat">
                    <div class="stat-number" id="failed-tests">0</div>
                    <div class="stat-label">Échoués</div>
                </div>
                <div class="stat">
                    <div class="stat-number" id="success-rate">0%</div>
                    <div class="stat-label">Taux de Réussite</div>
                </div>
            </div>

            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill"></div>
            </div>

            <div class="test-grid">
                <div class="test-section">
                    <h3>🔧 État des Gestionnaires</h3>
                    <div id="managers-status"></div>
                </div>
                
                <div class="test-section">
                    <h3>🔗 Tests de Navigation</h3>
                    <div id="navigation-tests"></div>
                </div>
                
                <div class="test-section">
                    <h3>⚙️ Tests Fonctionnels</h3>
                    <div id="functional-tests"></div>
                </div>
                
                <div class="test-section">
                    <h3>💾 Tests de Persistance</h3>
                    <div id="persistence-tests"></div>
                </div>
            </div>

            <div class="test-section">
                <h3>🚀 Actions de Test</h3>
                <button class="test-button" onclick="runAllTests()">🧪 Exécuter Tous les Tests</button>
                <button class="test-button" onclick="testNavigation()">🔗 Tester Navigation</button>
                <button class="test-button" onclick="testFunctionality()">⚙️ Tester Fonctionnalités</button>
                <button class="test-button" onclick="testPersistence()">💾 Tester Persistance</button>
                <button class="test-button" onclick="clearLogs()">🗑️ Effacer Logs</button>
                <button class="test-button" onclick="window.open('/', '_blank')">🚀 Ouvrir App</button>
            </div>
            
            <div class="test-section">
                <h3>📝 Logs de Test</h3>
                <div id="test-logs" class="log"></div>
            </div>
        </div>
    </div>

    <!-- Scripts - Même ordre que l'application principale -->
    <script src="js/license/crypto.js"></script>
    <script src="js/license/LicenseManager.js"></script>
    <script src="js/database/DatabaseManager.js"></script>
    <script src="js/modules/ClientManager.js"></script>
    <script src="js/modules/ProductManager.js"></script>
    <script src="js/modules/InvoiceManager.js"></script>
    <script src="js/modules/QuoteManager.js"></script>
    <script src="js/modules/ExpenseManager.js"></script>
    <script src="js/modules/SettingsManager.js"></script>
    <script src="js/app.js"></script>

    <script>
        let testApp;
        let testLogs = [];
        let testStats = {
            total: 0,
            passed: 0,
            failed: 0
        };

        function log(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const emoji = {
                'info': 'ℹ️',
                'success': '✅',
                'error': '❌',
                'warning': '⚠️'
            };
            
            const logEntry = `[${timestamp}] ${emoji[type]} ${message}`;
            testLogs.push(logEntry);
            
            const logsContainer = document.getElementById('test-logs');
            if (logsContainer) {
                logsContainer.textContent = testLogs.join('\n');
                logsContainer.scrollTop = logsContainer.scrollHeight;
            }
            
            console.log(logEntry);
        }

        function updateStats() {
            document.getElementById('total-tests').textContent = testStats.total;
            document.getElementById('passed-tests').textContent = testStats.passed;
            document.getElementById('failed-tests').textContent = testStats.failed;
            
            const successRate = testStats.total > 0 ? Math.round((testStats.passed / testStats.total) * 100) : 0;
            document.getElementById('success-rate').textContent = successRate + '%';
            
            const progressFill = document.getElementById('progress-fill');
            if (progressFill) {
                progressFill.style.width = successRate + '%';
            }
        }

        function addTest(name, passed, details = '') {
            testStats.total++;
            if (passed) {
                testStats.passed++;
                log(`${name}: RÉUSSI ${details}`, 'success');
            } else {
                testStats.failed++;
                log(`${name}: ÉCHOUÉ ${details}`, 'error');
            }
            updateStats();
        }

        function checkManagerStatus(name, globalVar) {
            const exists = typeof window[globalVar] !== 'undefined';
            const hasRender = exists && typeof window[globalVar].render === 'function';
            
            return {
                name,
                globalVar,
                exists,
                hasRender,
                status: exists && hasRender ? 'success' : 'error'
            };
        }

        function testManagersAvailability() {
            log('🔧 Test de disponibilité des gestionnaires...', 'info');
            
            const managers = [
                { name: 'ClientManager', globalVar: 'clientManager' },
                { name: 'ProductManager', globalVar: 'productManager' },
                { name: 'InvoiceManager', globalVar: 'invoiceManager' },
                { name: 'QuoteManager', globalVar: 'quoteManager' },
                { name: 'ExpenseManager', globalVar: 'expenseManager' },
                { name: 'SettingsManager', globalVar: 'settingsManager' }
            ];

            let html = '';
            managers.forEach(manager => {
                const status = checkManagerStatus(manager.name, manager.globalVar);
                const statusClass = status.status;
                const statusText = status.exists ? 
                    (status.hasRender ? '✅ Disponible' : '⚠️ Pas de render()') : 
                    '❌ Non trouvé';

                html += `
                    <div class="module-test">
                        <div class="test-result">
                            <span><strong>${status.name}</strong></span>
                            <span class="status ${statusClass}">${statusText}</span>
                        </div>
                    </div>
                `;

                addTest(`Manager ${status.name}`, status.status === 'success', `(${status.globalVar})`);
            });

            const statusContainer = document.getElementById('managers-status');
            if (statusContainer) {
                statusContainer.innerHTML = html;
            }
        }

        function testApplicationInitialization() {
            log('🚀 Test d\'initialisation de l\'application...', 'info');
            
            try {
                if (typeof Application !== 'undefined') {
                    testApp = new Application();
                    addTest('Initialisation Application', true, '- Classe Application disponible');
                } else {
                    addTest('Initialisation Application', false, '- Classe Application non disponible');
                }
            } catch (error) {
                addTest('Initialisation Application', false, `- Erreur: ${error.message}`);
            }
        }

        function testNavigation() {
            log('🔗 Test de navigation entre modules...', 'info');
            
            if (!testApp) {
                log('❌ Application non initialisée pour les tests de navigation', 'error');
                return;
            }

            const modules = [
                { name: 'Dashboard', module: 'dashboard' },
                { name: 'Clients', module: 'clients' },
                { name: 'Produits', module: 'products' },
                { name: 'Factures', module: 'invoices' },
                { name: 'Devis', module: 'quotes' },
                { name: 'Dépenses', module: 'expenses' },
                { name: 'Paramètres', module: 'settings' }
            ];

            let html = '';
            modules.forEach((moduleInfo, index) => {
                setTimeout(() => {
                    try {
                        testApp.loadModule(moduleInfo.module);
                        html += `
                            <div class="module-test">
                                <div class="test-result">
                                    <span><strong>${moduleInfo.name}</strong></span>
                                    <span class="status success">✅ Navigation OK</span>
                                </div>
                            </div>
                        `;
                        addTest(`Navigation ${moduleInfo.name}`, true, `- Module ${moduleInfo.module}`);
                    } catch (error) {
                        html += `
                            <div class="module-test">
                                <div class="test-result">
                                    <span><strong>${moduleInfo.name}</strong></span>
                                    <span class="status error">❌ Erreur</span>
                                </div>
                            </div>
                        `;
                        addTest(`Navigation ${moduleInfo.name}`, false, `- Erreur: ${error.message}`);
                    }
                    
                    const navContainer = document.getElementById('navigation-tests');
                    if (navContainer) {
                        navContainer.innerHTML = html;
                    }
                }, index * 200);
            });
        }

        function testFunctionality() {
            log('⚙️ Test des fonctionnalités CRUD...', 'info');
            
            // Test des fonctionnalités de base de chaque gestionnaire
            const functionalTests = [
                {
                    name: 'Base de Données',
                    test: () => typeof DatabaseManager !== 'undefined' && window.databaseManager
                },
                {
                    name: 'Gestion Licence',
                    test: () => typeof LicenseManager !== 'undefined' && window.licenseManager
                },
                {
                    name: 'Client - Méthodes CRUD',
                    test: () => window.clientManager && 
                              typeof window.clientManager.addClient === 'function' &&
                              typeof window.clientManager.updateClient === 'function' &&
                              typeof window.clientManager.deleteClient === 'function'
                },
                {
                    name: 'Produit - Méthodes CRUD',
                    test: () => window.productManager && 
                              typeof window.productManager.addProduct === 'function' &&
                              typeof window.productManager.updateProduct === 'function' &&
                              typeof window.productManager.deleteProduct === 'function'
                },
                {
                    name: 'Facture - Méthodes CRUD',
                    test: () => window.invoiceManager && 
                              typeof window.invoiceManager.createInvoice === 'function' &&
                              typeof window.invoiceManager.updateInvoice === 'function' &&
                              typeof window.invoiceManager.deleteInvoice === 'function'
                },
                {
                    name: 'Devis - Méthodes CRUD',
                    test: () => window.quoteManager && 
                              typeof window.quoteManager.createQuote === 'function' &&
                              typeof window.quoteManager.updateQuote === 'function' &&
                              typeof window.quoteManager.deleteQuote === 'function'
                },
                {
                    name: 'Dépense - Méthodes CRUD',
                    test: () => window.expenseManager && 
                              typeof window.expenseManager.addExpense === 'function' &&
                              typeof window.expenseManager.updateExpense === 'function' &&
                              typeof window.expenseManager.deleteExpense === 'function'
                },
                {
                    name: 'Paramètres - Configuration',
                    test: () => window.settingsManager && 
                              typeof window.settingsManager.saveSettings === 'function' &&
                              typeof window.settingsManager.loadSettings === 'function'
                }
            ];

            let html = '';
            functionalTests.forEach(test => {
                const result = test.test();
                html += `
                    <div class="module-test">
                        <div class="test-result">
                            <span><strong>${test.name}</strong></span>
                            <span class="status ${result ? 'success' : 'error'}">
                                ${result ? '✅ Fonctionnel' : '❌ Problème'}
                            </span>
                        </div>
                    </div>
                `;
                addTest(`Fonctionnalité ${test.name}`, result);
            });

            const funcContainer = document.getElementById('functional-tests');
            if (funcContainer) {
                funcContainer.innerHTML = html;
            }
        }

        function testPersistence() {
            log('💾 Test de persistance des données...', 'info');
            
            const persistenceTests = [
                {
                    name: 'LocalStorage Disponible',
                    test: () => typeof Storage !== 'undefined' && window.localStorage
                },
                {
                    name: 'IndexedDB Disponible',
                    test: () => typeof window.indexedDB !== 'undefined'
                },
                {
                    name: 'SQL.js Chargé',
                    test: () => typeof window.SQL !== 'undefined'
                },
                {
                    name: 'DatabaseManager Initialisé',
                    test: () => window.databaseManager && typeof window.databaseManager.init === 'function'
                }
            ];

            let html = '';
            persistenceTests.forEach(test => {
                const result = test.test();
                html += `
                    <div class="module-test">
                        <div class="test-result">
                            <span><strong>${test.name}</strong></span>
                            <span class="status ${result ? 'success' : 'error'}">
                                ${result ? '✅ Disponible' : '❌ Indisponible'}
                            </span>
                        </div>
                    </div>
                `;
                addTest(`Persistance ${test.name}`, result);
            });

            const persistContainer = document.getElementById('persistence-tests');
            if (persistContainer) {
                persistContainer.innerHTML = html;
            }
        }

        function clearLogs() {
            testLogs = [];
            testStats = { total: 0, passed: 0, failed: 0 };
            updateStats();
            
            const logsContainer = document.getElementById('test-logs');
            if (logsContainer) {
                logsContainer.textContent = '';
            }
            
            // Effacer les résultats des tests
            ['managers-status', 'navigation-tests', 'functional-tests', 'persistence-tests'].forEach(id => {
                const container = document.getElementById(id);
                if (container) {
                    container.innerHTML = '';
                }
            });
        }

        function runAllTests() {
            log('🚀 Début des tests complets de SamaFacture...', 'info');
            clearLogs();
            
            // Séquence de tests avec délais pour éviter les conflits
            setTimeout(() => testManagersAvailability(), 100);
            setTimeout(() => testApplicationInitialization(), 500);
            setTimeout(() => testNavigation(), 1000);
            setTimeout(() => testFunctionality(), 3000);
            setTimeout(() => testPersistence(), 4000);
            
            setTimeout(() => {
                log('✅ Tests complets terminés!', 'success');
                log(`📊 Résultats: ${testStats.passed}/${testStats.total} tests réussis (${Math.round((testStats.passed/testStats.total)*100)}%)`, 'info');
            }, 5000);
        }

        // Initialisation au chargement de la page
        document.addEventListener('DOMContentLoaded', () => {
            log('🎯 Page de test complète chargée', 'info');
            updateStats();
            
            // Auto-run tests après un délai
            setTimeout(() => {
                log('🔄 Exécution automatique des tests...', 'info');
                runAllTests();
            }, 1000);
        });
    </script>
</body>
</html>
