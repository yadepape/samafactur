<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test SamaFacture</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-result { margin: 10px 0; padding: 10px; border-radius: 5px; }
        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .info { background-color: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
        #test-results { margin-top: 20px; }
        button { padding: 10px 20px; margin: 5px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>
    <h1>🧪 Tests SamaFacture</h1>
    <p>Cette page teste les fonctionnalités principales de SamaFacture.</p>
    
    <button onclick="runAllTests()">🚀 Lancer tous les tests</button>
    <button onclick="clearResults()">🧹 Effacer les résultats</button>
    
    <div id="test-results"></div>

    <script>
        let testResults = [];
        
        function addTestResult(name, success, message) {
            const result = { name, success, message, timestamp: new Date() };
            testResults.push(result);
            displayResults();
        }
        
        function displayResults() {
            const container = document.getElementById('test-results');
            container.innerHTML = '<h2>📊 Résultats des Tests</h2>';
            
            testResults.forEach(result => {
                const div = document.createElement('div');
                div.className = `test-result ${result.success ? 'success' : 'error'}`;
                div.innerHTML = `
                    <strong>${result.success ? '✅' : '❌'} ${result.name}</strong><br>
                    ${result.message}<br>
                    <small>⏰ ${result.timestamp.toLocaleTimeString()}</small>
                `;
                container.appendChild(div);
            });
            
            // Résumé
            const total = testResults.length;
            const passed = testResults.filter(r => r.success).length;
            const failed = total - passed;
            
            const summary = document.createElement('div');
            summary.className = 'test-result info';
            summary.innerHTML = `
                <strong>📈 Résumé</strong><br>
                Total: ${total} | Réussis: ${passed} | Échoués: ${failed}
            `;
            container.appendChild(summary);
        }
        
        function clearResults() {
            testResults = [];
            document.getElementById('test-results').innerHTML = '';
        }
        
        async function runAllTests() {
            clearResults();
            addTestResult('Initialisation', true, 'Tests démarrés');
            
            // Test 1: Vérifier que les éléments DOM existent
            try {
                const mainContent = document.getElementById('main-content');
                if (mainContent) {
                    addTestResult('DOM - main-content', false, 'Élément main-content non trouvé (normal, pas dans cette page)');
                } else {
                    addTestResult('DOM - main-content', false, 'Élément main-content non trouvé (attendu)');
                }
            } catch (error) {
                addTestResult('DOM - main-content', false, `Erreur: ${error.message}`);
            }
            
            // Test 2: Vérifier localStorage
            try {
                localStorage.setItem('test-samafacture', 'test-value');
                const value = localStorage.getItem('test-samafacture');
                if (value === 'test-value') {
                    addTestResult('localStorage', true, 'localStorage fonctionne correctement');
                    localStorage.removeItem('test-samafacture');
                } else {
                    addTestResult('localStorage', false, 'localStorage ne fonctionne pas correctement');
                }
            } catch (error) {
                addTestResult('localStorage', false, `Erreur localStorage: ${error.message}`);
            }
            
            // Test 3: Vérifier les APIs du navigateur
            try {
                if ('serviceWorker' in navigator) {
                    addTestResult('Service Worker', true, 'API Service Worker disponible');
                } else {
                    addTestResult('Service Worker', false, 'API Service Worker non disponible');
                }
            } catch (error) {
                addTestResult('Service Worker', false, `Erreur: ${error.message}`);
            }
            
            // Test 4: Vérifier fetch API
            try {
                const response = await fetch('/manifest.json');
                if (response.ok) {
                    addTestResult('Fetch API', true, 'Fetch API fonctionne - manifest.json accessible');
                } else {
                    addTestResult('Fetch API', false, `Fetch API erreur: ${response.status}`);
                }
            } catch (error) {
                addTestResult('Fetch API', false, `Erreur Fetch: ${error.message}`);
            }
            
            // Test 5: Vérifier les fonctionnalités CSS
            try {
                const testDiv = document.createElement('div');
                testDiv.style.display = 'flex';
                if (testDiv.style.display === 'flex') {
                    addTestResult('CSS Flexbox', true, 'Support CSS Flexbox confirmé');
                } else {
                    addTestResult('CSS Flexbox', false, 'Support CSS Flexbox non confirmé');
                }
            } catch (error) {
                addTestResult('CSS Flexbox', false, `Erreur CSS: ${error.message}`);
            }
            
            // Test 6: Vérifier les événements
            try {
                let eventWorked = false;
                const testButton = document.createElement('button');
                testButton.addEventListener('click', () => { eventWorked = true; });
                testButton.click();
                
                if (eventWorked) {
                    addTestResult('Événements DOM', true, 'Système d\'événements fonctionne');
                } else {
                    addTestResult('Événements DOM', false, 'Système d\'événements ne fonctionne pas');
                }
            } catch (error) {
                addTestResult('Événements DOM', false, `Erreur événements: ${error.message}`);
            }
            
            // Test 7: Vérifier les modules ES6
            try {
                const testClass = class TestClass {
                    constructor() {
                        this.test = true;
                    }
                    
                    getTest() {
                        return this.test;
                    }
                };
                
                const instance = new testClass();
                if (instance.getTest() === true) {
                    addTestResult('Classes ES6', true, 'Support des classes ES6 confirmé');
                } else {
                    addTestResult('Classes ES6', false, 'Support des classes ES6 non confirmé');
                }
            } catch (error) {
                addTestResult('Classes ES6', false, `Erreur ES6: ${error.message}`);
            }
            
            addTestResult('Tests terminés', true, 'Tous les tests ont été exécutés');
        }
        
        // Lancer les tests automatiquement au chargement
        window.addEventListener('load', () => {
            setTimeout(runAllTests, 1000);
        });
    </script>
</body>
</html>
